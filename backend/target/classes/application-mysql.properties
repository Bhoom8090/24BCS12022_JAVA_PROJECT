server.port=8081

# MySQL profile - use this if you have a MySQL server and want a shared/production DB.
# Activate with:  .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=mysql"
# or set SPRING_PROFILES_ACTIVE=mysql.
# Set MYSQL_PASSWORD (and optionally MYSQL_URL / MYSQL_USER) in your environment,
# or edit the defaults below.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/pong_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:mySQLpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# creates the "matches" table automatically if it does not exist
spring.jpa.hibernate.ddl-auto=update
