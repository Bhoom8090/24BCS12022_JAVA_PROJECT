server.port=8081

# Default database: embedded H2 (file-based).
# Works out of the box - no server or password needed. Matches are stored
# locally in backend/data/pongdb.mv.db (created automatically).
# H2 console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/pongdb, user: sa, empty password)
spring.datasource.url=jdbc:h2:file:./data/pongdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# creates the "matches" table automatically if it does not exist
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Want MySQL instead? Start with:  .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=mysql"
# (or set SPRING_PROFILES_ACTIVE=mysql). See application-mysql.properties.
